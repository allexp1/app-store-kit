<!doctype html>
<!-- app-store-kit template: caption-top. Caption above a device-framed capture, device anchored to the bottom.
     render.py fills the CSS custom properties on .frame; every length is a whole pixel. -->
<html><head><meta charset="utf-8"><style>
.t-caption-top{position:relative;overflow:hidden;width:var(--w);height:var(--h);background:var(--bg)}
.t-caption-top .caption{position:absolute;left:var(--cap-side);right:var(--cap-side);top:var(--cap-top);margin:0;
  color:var(--ink);font-family:var(--font);font-weight:700;font-size:var(--fs);line-height:1.08;letter-spacing:-0.02em;
  text-align:center;text-wrap:balance}
.t-caption-top .device{position:absolute;left:var(--dev-x);top:var(--dev-y);padding:var(--bezel);
  border-radius:calc(var(--radius) + var(--bezel));background:var(--device)}
.t-caption-top .device img{display:block;width:var(--dev-w);height:var(--dev-h);border-radius:var(--radius);object-fit:cover}
</style></head><body style="margin:0">
<div class="frame t-caption-top" id="{{ID}}" style="{{VARS}}">
  <p class="caption">{{CAPTION}}</p>
  <div class="device"><img alt="" src="{{SCREEN}}"></div>
</div>
</body></html>
